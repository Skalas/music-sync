# .metate/profile.yml — per-repo config for the `metate` pipeline.
# The skill engines are codebase-agnostic; everything project-specific lives here.
# bootstrap.sh fills in the gates from detected tooling — adjust everything else.

# --- gates ---------------------------------------------------------------
fastGate: "ruff check . && pytest"   # quick loop, run after each review round
shipGate: "ruff check . && mypy . && pytest"   # full pre-PR gate (mirrors CI)

# --- implementer (the only writer) ---------------------------------------
implementer:
  backend: claude          # cursor | codex | claude | gemini
  model: sonnet            # e.g. composer-2.5 | gpt-5.3-codex-fast (blank = adapter default)

isolation: none            # none | worktree

# --- codebase memory (optional structural context provider) ---------------
# When enabled, review sub-agents prefer the knowledge graph (codebase-memory-mcp)
# over grep/Read for structural discovery — impact of the diff, callers of changed
# symbols, reviewFocus invariants traced through the call graph. Absent or
# enabled:false → metate runs exactly as before (graceful degradation, no dependency).
codebaseMemory:
  enabled: true           # true once `codebase-memory-mcp install` wired the MCP entry + repo is indexed
  reindex: git             # git | always | manual — refresh the graph between rounds after the implementer patches
  indexCommand: ""         # blank = rely on the auto_index git watcher; else an explicit reindex command

# --- review (metate-review) -----------------------------------------------
# What the read-only sub-agents must scrutinize in THIS codebase. Replace with
# your real invariants — the difference between a generic review and one that
# catches your domain's actual failure modes.
reviewFocus: |
  - N-way union correctness: a track liked on ANY platform must be queued for EVERY
    other platform where it is absent and not already recorded as synced. Adding a 3rd
    platform must not silently change the existing Spotify⇄Apple behavior.
  - All writes to every platform (Spotify, Apple, Tidal) are opt-in/guarded. A default
    run reads, writes per-platform review files, and updates the DB — it never mutates a
    remote library without the platform's explicit --apply flag.
  - The normalized match key (name+primary artist) is the single source of cross-platform
    identity. Never write to one platform using another platform's raw track id; always
    resolve through a per-platform search/match.
  - SQLite is the source of truth. Every sync decision and CSV export derives from the
    `presence` rows. Upserts are idempotent (no duplicate keys), and a missing/locked DB
    must fail loudly, never produce a partial sync.
  - Tidal official-API coverage for personal favorites read/write is uncertain. The Tidal
    adapter must degrade gracefully — on auth/scope/endpoint failure it skips the Tidal
    direction with a clear message and never crashes the Spotify⇄Apple path.
  - Secrets: Tidal client id/secret and tokens come from .env / token cache only; never
    logged, never committed. New runtime artifacts (*.db, CSV exports, tidal cache) are
    git-ignored.

# Which buckets the implementer auto-fixes each round. Reporting is unconditional —
# whatever isn't auto-fixed is still surfaced for you to decide.
#   blockers           — only blockers fixed; warnings + DESIGN reported  (safest, default)
#   blockers+warnings  — blockers + warnings fixed; DESIGN reported
#   all                — blockers + warnings + DESIGN fixed (most churn; may rewrite working code)
# --- build (metate-build): round 0 writes, rounds 1–3 review
build:
  autoFix: blockers

# --- prep (metate-prep) ---------------------------------------------------
start:
  baseBranch: main         # branch new work from here (set to `dev` if you gitflow)
  readingOrder:            # docs to read before building, in order
    - README.md
    - docs/sprint-tidal-db.md
  techDebtFile: ""         # e.g. docs/TECH-DEBT.md
  issues:                  # file the issue ledger from the text plan at sprint start
    create: false          # no git remote yet → ledger managed locally in issues.json
    tracker: github        # gh CLI
    granularity: test-matrix  # one issue per DoD test-matrix item (T1…Tn)
    labels: ["sprint"]     # applied to every filed issue
    milestone: ""          # blank = none

# --- smoke (metate-smoke) -------------------------------------------------
verify:
  # Offline behavior proof: seed a throwaway SQLite library, run an offline dry-run
  # reconcile (no network), then prove CSV export. Build must provide the --offline/--db
  # flags and the seed entrypoint these reference.
  command: "uv run python sync_music.py --offline --dry-run --db .metate/smoke.db && uv run python sync_music.py --offline --export /tmp/smoke_export.csv --db .metate/smoke.db && test -s /tmp/smoke_export.csv"
  seedCommand: "uv run python -m musicsync.seed --db .metate/smoke.db"   # must be idempotent

# --- aftercare (metate-aftercare) -----------------------------------------
# Deliverables to create/update at sprint close. Use {N} for the sprint number.
ship:
  deliverables:
    - "docs/handoff/post-sprint-{N}.md"
    - "README.md"
    - "CHANGELOG.md"

  prTarget: main           # PR target; set to `dev` if you gitflow (match baseBranch)
  commitStyle: "conventional, bisectable, one per layer"
  issueCloseKeyword: "Closes"   # PR body keyword for auto-close
