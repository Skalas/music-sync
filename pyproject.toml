[project]
name = "music-sync"
version = "0.2.0"
description = "Conciliador N-way de Liked Songs entre Spotify, Apple Music y Tidal (local y soberano)"
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.24.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
    "unidecode>=1.3.8",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musicsync"]
[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
